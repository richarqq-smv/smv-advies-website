name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js instantieert altijd een RealtimeClient
          # (ook al gebruikt deze app geen Realtime-subscriptions), en die
          # heeft op Node.js een NATIVE WebSocket-implementatie nodig — pas
          # aanwezig vanaf Node 22. Op Node 20 faalt scripts/prerender.mjs
          # daardoor hard bij het importeren van supabaseClient.js ("Node.js
          # detected but native WebSocket not found"), voor elke route, niet
          # alleen de auth-/klantroutes. Node 22 is ook wat Supabase zelf als
          # minimum aanraadt.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Publieke Project URL + anon/publishable key — veilig om in de
          # frontendbundel te staan (RLS is de echte beveiligingsgrens, zie
          # SECURITY_MODEL.md), maar wel verplicht aanwezig op build-time:
          # prerender.mjs importeert src/lib/supabaseClient.js voor elke
          # route (ook de publieke), en die gooit een expliciete fout als
          # deze twee ontbreken — zonder deze twee repository variabelen
          # (Settings -> Secrets and variables -> Actions -> Variables,
          # NIET Secrets, want dit zijn geen geheime waarden) faalt de
          # volledige build, niet alleen de nieuwe auth-/klantroutes.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
