<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Beveiligingsronde (2026-10-12): de Content-Security-Policy-meta-tag
      wordt NIET hier in de brontemplate gezet, maar pas door
      scripts/prerender.mjs in elk gegenereerd dist/*.html-bestand
      geïnjecteerd (zie dat bestand). Reden: deze index.html is ook de
      template die `vite dev` rechtstreeks serveert, en Vite's eigen
      React-Refresh-preamble/HMR-client gebruiken zelf inline scripts die
      een strikte CSP zou blokkeren — dat zou de lokale dev-server breken.
      In productie (dist/) is er geen HMR en kan een strikte CSP wél.

      De twee vroeger inline Consent-Mode/gtag-scripts hieronder zijn wel
      al verplaatst naar /consent-mode.js en /gtag-init.js (externe,
      same-origin bestanden) — dat is onafhankelijk van de CSP-vraag en
      verandert niets aan het gedrag, in dev of productie.
    -->
    <!--
      Consent Mode v2 default — must run unconditionally on every page
      load, before the Google tag itself (which loads only after the
      cookiebanner's "Accepteren", see src/lib/analytics.js). This is
      the one and only place 'consent','default' is declared. Extern
      bestand i.p.v. inline, zie CSP-toelichting hierboven.
    -->
    <script src="/consent-mode.js"></script>
    <!--
      Static gtag.js tag, per Google's own documented pattern. Loading it
      unconditionally (rather than via dynamic document.createElement,
      which was proven — via an isolated A/B test — to silently break
      gtag.js's internal consent/measurement processing even though the
      script itself loads and runs) is what makes Consent Mode actually
      work. The denied default above means no cookie is set and no hit is
      sent until src/lib/analytics.js sends 'consent','update' after the
      visitor clicks "Accepteren".
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CE0DFH59Z9"></script>
    <script src="/gtag-init.js"></script>
    <!--
      Trustpilot TrustBox "Review Collector" (Deel en promoot > Website-
      widgets, gratis in elk plan) — zelfde patroon als gtag.js hierboven:
      statische, onvoorwaardelijke async script-tag i.p.v. dynamisch
      geïnjecteerd, zodat het de widget-div in Footer.jsx altijd kan
      vinden zodra het script laadt (de div staat al in de geprerenderde
      HTML, dus geen race condition met React-hydratie).
    -->
    <script type="text/javascript" src="https://widget.trustpilot.com/bootstrap/v5/tp.widget.bootstrap.min.js" async></script>
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16293A" />
    <!--
      Mobiele-adminronde (2026-09-30) — minimale, veilige iOS "Add to Home
      Screen"-voorbereiding (zie het PWA-onderzoek in het gespreksverslag):
      alleen meta-tags, geen manifest.json/service worker. Deze twee regels
      wijzigen niets aan gewoon browsen (ze doen pas iets zodra iemand
      expliciet "Zet op beginscherm" kiest in Safari), dus geen risico voor
      de publieke site. site-wide (dit bestand is de enige HTML-template,
      ook voor /admin) — dat is hier geen probleem: alleen wie zelf vanaf
      /admin "Zet op beginscherm" kiest, ziet het effect.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SMV Advies" />
    <meta name="description" content="SMV Advies levert onafhankelijk verduurzamingsadvies voor mkb-bedrijfspanden in de Hoeksche Waard. Heldere rapportage, praktisch toepasbaar, stap voor stap." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SMV Advies" />
    <meta property="og:title" content="SMV Advies — Verduurzamingsadvies voor het mkb" />
    <meta property="og:description" content="Onafhankelijk verduurzamingsadvies voor mkb-bedrijfspanden in de Hoeksche Waard." />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:image" content="https://smv-advies.nl/logo.png" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SMV Advies — Verduurzamingsadvies voor het mkb | Hoeksche Waard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
